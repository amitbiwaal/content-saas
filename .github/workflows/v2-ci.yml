# ContentOS v2 CI — the canonical Sprint 0 runtime verification.
#
# Separate from `ci.yml`, which builds the v1 Python/Next application. ADR-016:
# v1 remains operational until v2 replaces it, so the two pipelines coexist and
# neither touches the other.
#
# Every gate BLOCKS. None warns (`07-development-guide/ci-cd.md`).
#
# SERVICE CONTAINERS: PostgreSQL 17 + pgvector and Redis 7 run as real servers.
# PostgreSQL is never replaced by SQLite and RLS is never mocked — RLS is a
# database behaviour, and a mocked database asserts the test's assumptions
# rather than PostgreSQL's semantics (`16-security/row-level-security.md`).
#
# MinIO, Mailpit and ClamAV are NOT started. Justification: no Sprint 0 code
# reaches object storage, SMTP, or the malware scanner. The four packages
# (`contracts`, `observability`, `database`, `security`) and `services/api`
# contain no storage driver, no mail transport, and no scan client — those
# arrive with `packages/storage` in Sprint 2. Starting them here would add ~3
# minutes of ClamAV signature loading to every run to verify nothing. They are
# defined in `infrastructure/containers/docker-compose.yml` for local
# development and become CI services when the code that uses them lands.

name: v2 CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'workers/**'
      - 'packages/**'
      - 'tests/**'
      - 'scripts/**'
      - 'infrastructure/**'
      - '*.json'
      - '*.yaml'
      - '*.cjs'
      - '*.js'
      - '*.ts'
      - '.github/workflows/v2-ci.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'services/**'
      - 'workers/**'
      - 'packages/**'
      - 'tests/**'
      - 'scripts/**'
      - 'infrastructure/**'
      - '*.json'
      - '*.yaml'
      - '*.cjs'
      - '*.js'
      - '*.ts'
      - '.github/workflows/v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.4'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Static gates. No infrastructure needed, so they fail fast and in parallel
  # with the database job.
  # ───────────────────────────────────────────────────────────────────────────
  static:
    name: Static gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # `ignore-scripts` is set in .npmrc; the allowlist starts empty.
      - name: 1 · install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: 2 · typecheck
        run: pnpm typecheck

      - name: 3 · lint
        run: pnpm lint

      - name: 4 · format
        run: pnpm format

      - name: 5 · dependency boundaries
        run: pnpm boundaries

      - name: 6 · knip (unused files, exports, dependencies)
        run: pnpm unused

      - name: 11 · build every workspace
        run: pnpm build

  # ───────────────────────────────────────────────────────────────────────────
  # Runtime verification against real infrastructure.
  # ───────────────────────────────────────────────────────────────────────────
  runtime:
    name: Runtime verification (PostgreSQL 17 + Redis 7)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # GitHub's default `run` shell on Linux is `bash -e` WITHOUT pipefail, so
    # `script 2>&1 | tee log` returns tee's exit code and a failing migration
    # reports success. `shell: bash` is `bash --noprofile --norc -eo pipefail`,
    # which makes the failure propagate. Step 4b passed on run 30463671176 while
    # migration 0005 was actually failing underneath it.
    defaults:
      run:
        shell: bash

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: contentos
          POSTGRES_PASSWORD: contentos_ci
          POSTGRES_DB: contentos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contentos -d contentos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: contentos
      PGPASSWORD: contentos_ci
      PGDATABASE: contentos
      # The application connects as the RLS-ENFORCED role, never as the owner.
      APP_DATABASE_URL: postgresql://contentos_app_login:contentos_ci_app@localhost:5432/contentos
      DATABASE_URL: postgresql://contentos_app_login:contentos_ci_app@localhost:5432/contentos
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 1 · install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The runner needs a psql client to reach the service container.
      - name: install postgresql-client 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 redis-tools
          psql --version
          redis-cli --version

      - name: 3 · verify services are healthy
        id: services
        run: |
          mkdir -p ci-logs
          {
            echo "=== PostgreSQL ==="
            psql -tA -c "SELECT version()"
            echo "=== pgvector available ==="
            psql -tA -c "SELECT name, default_version FROM pg_available_extensions WHERE name='vector'"
            echo "=== Redis ==="
            redis-cli -h localhost -p 6379 ping
            redis-cli -h localhost -p 6379 info server | head -3
          } | tee ci-logs/services.log
          # pgvector must be AVAILABLE; migration 0019 creates it later.
          test "$(psql -tA -c "SELECT count(*) FROM pg_available_extensions WHERE name='vector'")" = "1"

      # Local development gets these from the compose init script, which a
      # service container cannot mount. Same SQL, applied explicitly.
      - name: 4a · create login roles
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE contentos_app_login LOGIN PASSWORD 'contentos_ci_app';"
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE contentos_migrator_login LOGIN PASSWORD 'contentos_ci_migrator';"

      - name: 4b · apply migrations
        run: |
          mkdir -p ci-logs
          if ! bash scripts/db/migrate.sh 2>&1 | tee ci-logs/migrations.log; then
            echo "::error title=Migration failed::$(tail -30 ci-logs/migrations.log | paste -sd'~' -)"
            exit 1
          fi

      - name: 4c · verify no migration drift (idempotent re-run)
        run: |
          if ! bash scripts/db/migrate.sh 2>&1 | tee ci-logs/migrations-rerun.log; then
            echo "::error title=Migration re-run failed::$(tail -30 ci-logs/migrations-rerun.log | paste -sd'~' -)"
            exit 1
          fi
          cat ci-logs/migrations-rerun.log >> ci-logs/migrations.log
          # A second run must apply NOTHING. Checked against the re-run's own
          # output, not the appended file — the first run's summary also
          # contains the digit 0 and would mask a real drift.
          if ! grep -q "(0 applied" ci-logs/migrations-rerun.log; then
            echo "::error title=Migration drift::$(tail -10 ci-logs/migrations-rerun.log | paste -sd'~' -)"
            exit 1
          fi

      - name: 4d · seed development data
        run: |
          if ! bash scripts/db/seed.sh 2>&1 | tee ci-logs/seed.log; then
            echo "::error title=Seed failed::$(tail -30 ci-logs/seed.log | paste -sd'~' -)"
            exit 1
          fi
          cat ci-logs/seed.log >> ci-logs/migrations.log

      # 5 + 10 · the security-critical gate. Never skipped, never mocked.
      - name: 5 · RLS verification against real PostgreSQL
        run: |
          mkdir -p ci-logs
          if ! bash scripts/db/verify-rls.sh 2>&1 | tee ci-logs/rls-verification.log; then
            echo "::error title=RLS verification failed::$(tail -30 ci-logs/rls-verification.log | paste -sd'~' -)"
            exit 1
          fi

      # The ledger's append-only guarantee is a PRIVILEGE, so it is only
      # observable on a connection that holds it. Runs as contentos_app_login.
      - name: 5b · credit ledger verification against real PostgreSQL
        run: |
          mkdir -p ci-logs
          if ! bash scripts/db/verify-ledger.sh 2>&1 | tee ci-logs/ledger-verification.log; then
            echo "::error title=Ledger verification failed::$(tail -30 ci-logs/ledger-verification.log | paste -sd'~' -)"
            exit 1
          fi

      # The Sprint Gate: no double-charge under concurrency, exactly-once
      # financial effect, and the projection reconciling with the ledger. The
      # races run in genuinely parallel backends — an in-process fake cannot
      # show that an advisory lock serialises across connections.
      - name: 5c · credits verification against real PostgreSQL
        run: |
          mkdir -p ci-logs
          if ! bash scripts/db/verify-credits.sh 2>&1 | tee ci-logs/credits-verification.log; then
            echo "::error title=Credits verification failed::$(tail -30 ci-logs/credits-verification.log | paste -sd'~' -)"
            exit 1
          fi

      - name: 7 · full test suite (with real DATABASE_URL)
        run: pnpm test -- --coverage --reporter=default --reporter=junit --outputFile.junit=ci-logs/junit.xml

      - name: upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: ci-logs/junit.xml
          if-no-files-found: warn

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

      - name: upload migration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-logs
          path: ci-logs/migrations.log
          if-no-files-found: warn

      - name: upload RLS verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rls-verification-logs
          path: ci-logs/rls-verification.log
          if-no-files-found: warn

      - name: upload ledger verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-verification-logs
          path: ci-logs/ledger-verification.log
          if-no-files-found: warn

      - name: upload credits verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credits-verification-logs
          path: ci-logs/credits-verification.log
          if-no-files-found: warn

      - name: upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: ci-logs/services.log
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────────────────
  # Supply-chain gates.
  # ───────────────────────────────────────────────────────────────────────────
  secrets:
    name: Committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # history, not just the working tree
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  licences:
    name: Licences
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: deny copyleft in distributed code
        run: |
          pnpm licenses list --json > licences.json
          node scripts/ci/check-licences.mjs

  # Single required status check for branch protection.
  sprint-0-gate:
    name: Sprint 0 gate
    runs-on: ubuntu-latest
    needs: [static, runtime, secrets, licences]
    if: always()
    steps:
      - name: assert every gate passed
        run: |
          echo "static:    ${{ needs.static.result }}"
          echo "runtime:   ${{ needs.runtime.result }}"
          echo "secrets:   ${{ needs.secrets.result }}"
          echo "licences:  ${{ needs.licences.result }}"
          test "${{ needs.static.result }}"   = "success"
          test "${{ needs.runtime.result }}"  = "success"
          test "${{ needs.secrets.result }}"  = "success"
          test "${{ needs.licences.result }}" = "success"
